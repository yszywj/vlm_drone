schema_version: 1

simulation:
  # The demo is finite and headless by default so it is safe to run on a server.
  headless: true
  physics_dt_s: 0.016666666666666666
  # Phase 2 uses one kinematic update per World.step, so physics/render dt match.
  rendering_dt_s: 0.016666666666666666
  stage_units_in_meters: 1.0
  demo_steps: 120

scene:
  # [x, y, z]; x/y are centered on the world origin and z starts at 0.
  size_xyz_m: [100.0, 100.0, 30.0]
  # This is the single geometry source used by Isaac scene construction,
  # ideal-camera perception, collision monitoring, visualisation, and critics.
  obstacles:
    - obstacle_id: box_red
      center_xyz_m: [12.0, 4.0, 1.0]
      size_xyz_m: [3.0, 3.0, 2.0]
      color_rgb: [0.75, 0.25, 0.20]
      collidable: true
      motion_state: STATIC
    - obstacle_id: box_blue
      center_xyz_m: [-15.0, 5.0, 1.5]
      size_xyz_m: [3.0, 2.1, 3.0]
      color_rgb: [0.20, 0.35, 0.80]
      collidable: true
      motion_state: STATIC

uavs:
  - id: uav_1
    display_name: UAV 1
    home_name: home_uav_1
    # Initial orientation is identity: yaw=0, with the UAV nose along world +X.
    initial_position_xyz_m: [0.0, 0.0, 10.0]
    max_speed_mps: 5.0
    max_yaw_rate_deg_s: 60.0
    camera_profile: default_rgb

camera_profiles:
  default_rgb:
    # [width, height]
    resolution_wh_px: [640, 480]
    # Must be an integer divisor of the 60 Hz rendering rate.
    frequency_hz: 10
    horizontal_fov_deg: 90.0
    # Optional Isaac Camera focal length in stage units (meter here).
    # When null, focal length is derived from horizontal_fov_deg.
    focal_length_m: null
    # Negative pitch points the camera downward relative to the UAV body.
    pitch_deg: -45.0

# Privileged geometry is filtered through the rendered camera frustum before
# it is exposed.  The feature remains disabled unless explicitly requested.
obstacle_perception:
  mode: disabled  # disabled | ideal_camera
  max_distance_m: 40.0
  min_bbox_area_px: 64
  max_occlusion_ratio: 0.95

# Target perception is an independent capability.  Keep it off in the public
# default so legacy/unit-test runs never start a model service implicitly.
target_perception:
  backend: disabled  # disabled | oracle_evaluation | ultralytics_service

targets:
  - id: target
    semantic_alias: moving target
    appearance:
      shape: CUBE
      color_name: red
      color_rgb: [1.0, 0.12, 0.05]
      size_xyz_m: [0.6, 0.6, 1.0]
    # Closed axis-aligned bounds; setup uses their center as the spawn position.
    initial_region:
      # This default puts the first target near the onboard camera's optical axis.
      min_xyz_m: [9.0, -1.0, 0.5]
      max_xyz_m: [11.0, 1.0, 0.5]
    max_speed_mps: 1.5
    motion:
      mode: RANDOM_WALK  # STATIC | LINEAR | RANDOM_WALK
      region:
        min_xyz_m: [-40.0, -40.0, 0.5]
        max_xyz_m: [40.0, 40.0, 0.5]
      speed_mps: 1.0
      initial_heading_deg: 0.0
      direction_change_interval_s: 4.0
      seed: 7

fleet:
  minimum_uav_separation_m: 5.0
  target_claim_policy: EXCLUSIVE
  route_conflict_policy: LOWER_PRIORITY_HOLDS
  assignment_failure_policy: REPORT_AND_REPLAN

search:
  # SearchSkill constructor accepts this mode; FACE_POINT keeps the camera
  # aimed toward the region while moving around its perimeter.
  transit_yaw_mode: FACE_POINT  # FACE_POINT | COURSE_ALIGNED | KEEP_CURRENT
  radius_m: 25.0
  timeout_s: 120.0

# Trusted limits for high-level dynamic Skill plans.  These values are never
# delegated to the language model and are enforced again during preflight.
planner:
  max_plan_steps: 10
  max_goto_calls: 5
  max_search_calls: 1
  max_track_calls: 2
  max_reacquire_attempts_per_track: 2
  max_total_reacquire_attempts: 4
  min_track_duration_s: 1.0
  max_track_duration_s: 600.0
  default_on_target_lost: REACQUIRE  # REACQUIRE | FAIL
  default_reacquire_max_attempts: 2
  default_reacquire_search_radius_m: 10.0
  default_reacquire_timeout_s: 30.0

# Runtime model and visual-review limits.  Every block is finite and bounded;
# the visual reviewer remains opt-in and non-controlling by default.
model_worker:
  max_inflight_per_uav: 1
  request_timeout_s: 20.0

model_broker:
  max_inflight_global: 4
  max_inflight_per_uav: 1
  max_pending_per_uav: 2
  starvation_timeout_s: 15.0

qwen_visual_review:
  enabled: false
  mode: shadow  # shadow | gate
  goto_interval_s: 5.0
  search_interval_s: 2.0
  inspect_interval_s: 1.0
  track_interval_s: 5.0
  max_recent_frames: 3
  max_image_side_px: 1024
  jpeg_quality: 80
  hover_position_tolerance_m: 0.25
  hover_max_correction_speed_mps: 0.5
  # Allows the bounded obstacle-route repair sequence to remain in HOLD during
  # normal model latency. HTTP retries use wall time, so this remains an
  # independent trusted simulation-time safety deadline rather than a sum of
  # transport timeouts.
  blocking_hover_timeout_s: 75.0
  blocking_timeout_fallback: CANCEL_AND_LAND  # RESUME_PREVIOUS | CANCEL_AND_LAND

plan_revision:
  enabled: true
  max_revisions: 3
  cooldown_s: 5.0

frame_store:
  max_frames: 24
  max_bytes: 67108864
  max_age_s: 20.0

debug_images:
  enabled: false
  max_images_per_run: 20

# Lightweight experiment-output defaults.  Raw sensor artifacts and periodic
# checkpoints remain deliberately disabled on the shared server.
experiment:
  name: oracle_baseline
  seed: 42
  output_root: null

logging:
  terminal: true
  console_log_interval_updates: 10
  print_every_episode: false
  debug_logging: false
  csv: true

tensorboard:
  enabled: true
  scalars_only: true
  log_interval_updates: 1
  flush_interval_s: 30.0

checkpoint:
  save_best: true
  save_latest: true
  latest_interval_steps: 50000
  save_periodic: false
  save_full_base_model: false
  save_adapter_only: true
  save_optimizer_in_latest_only: true

evaluation:
  enabled: true
  interval_steps: 20000
  num_validation_episodes: 50
  num_test_episodes: 200
  deterministic: true
  fixed_validation_seeds: true
  fixed_test_seeds: true

artifacts:
  save_images: false
  save_videos: false
  save_trajectories: false
  save_observations: false
  save_raw_frames: false

figures:
  enabled: true
  format: png
  save_pdf: false

storage:
  min_free_space_gb_before_start: 20.0
  min_free_space_gb_during_run: 10.0
  warning_run_size_gb: 3.0
  max_run_size_gb: 5.0

results:
  detail_level: standard
  state_sample_hz: 1.0
  save_summary_figures: true
  save_camera_images: false
  save_videos: false
  save_raw_frames: false
  save_observations: false
  retain_model_proposals: true
  retain_prompts: false
  max_record_bytes: 32768
  max_stream_bytes: 8388608
  max_run_bytes: 33554432
