# Reuses the completed immutable V1 cache. No prepare step or PC transfer.
base_config: validity_probe_geometry_v2_50k.yaml
suite_name: head_regularized_v2
fit:
  epochs: 10
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0
  hard_example_weight: 1.0
  seed: 42
  class_balance_power: 0.0
  anchor_logit_weight: 0.0
experiments:
  - name: natural
    overrides: {}
  - name: natural_anchor
    overrides:
      anchor_logit_weight: 0.1
  - name: mild_anchor
    overrides:
      class_balance_power: 0.25
      anchor_logit_weight: 0.1
