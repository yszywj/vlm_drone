name: yolo_perception
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=25.2
  - pip:
      # This CUDA 12.6 stack is the one used by the real yolo26s.pt smoke
      # test; it remains isolated from the Isaac Sim environment.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.0+cu126
      - torchvision==0.22.0+cu126
      # YOLO26 was released with the expanded SPPF/C3k2 architecture in 8.4.0.
      # The checkpoint's older self-reported version is not a compatibility pin.
      - ultralytics==8.4.0
      # Ultralytics BoT-SORT imports LAP at runtime; pin it instead of relying
      # on Ultralytics' process-time auto-install fallback.
      - lap==0.5.13
      # ONNX is the only mandatory export dependency.  The backend disables
      # graph simplification so it never asks Ultralytics to auto-install
      # onnxslim/onnxruntime at export time.  TensorRT remains host-specific
      # and is intentionally not installed by this portable environment.
      - onnx==1.22.0
      - fastapi==0.115.7
      - uvicorn[standard]==0.29.0
      - python-multipart==0.0.20
      - opencv-python-headless==4.11.0.86
      - Pillow==11.3.0
      - numpy==1.26.0
      - PyYAML==6.0.2
      - httpx==0.28.1
      - pytest==8.4.1
