schema_version: 1

simulation:
  headless: true
  physics_dt_s: 0.016666666666666666
  rendering_dt_s: 0.016666666666666666
  stage_units_in_meters: 1.0
  demo_steps: 120

scene:
  size_xyz_m: [100.0, 100.0, 30.0]
  obstacles:
    - obstacle_id: box_red
      center_xyz_m: [12.0, 4.0, 1.0]
      size_xyz_m: [3.0, 3.0, 2.0]
      color_rgb: [0.75, 0.25, 0.20]
      collidable: true
      motion_state: STATIC
    - obstacle_id: box_blue
      center_xyz_m: [-15.0, 5.0, 1.5]
      size_xyz_m: [3.0, 2.1, 3.0]
      color_rgb: [0.20, 0.35, 0.80]
      collidable: true
      motion_state: STATIC

uavs:
  - id: uav_a
    display_name: 无人机A
    initial_position_xyz_m: [-3.0, 0.0, 0.0]
    home_name: home_a
    max_speed_mps: 5.0
    max_yaw_rate_deg_s: 60.0
    camera_profile: default_rgb
  - id: uav_b
    display_name: 无人机B
    initial_position_xyz_m: [3.0, 0.0, 0.0]
    home_name: home_b
    max_speed_mps: 5.0
    max_yaw_rate_deg_s: 60.0
    camera_profile: default_rgb

camera_profiles:
  default_rgb:
    resolution_wh_px: [640, 480]
    frequency_hz: 10
    horizontal_fov_deg: 90.0
    focal_length_m: null
    pitch_deg: -45.0

obstacle_perception:
  mode: disabled
  max_distance_m: 40.0
  min_bbox_area_px: 64
  max_occlusion_ratio: 0.95

target_perception:
  backend: ultralytics_service
  yolo_service:
    url: http://127.0.0.1:8011
    per_uav_urls:
      uav_a: http://127.0.0.1:8011
      uav_b: http://127.0.0.1:8012
    request_timeout_s: 0.5
    max_result_age_s: 0.5
    jpeg_quality: 90
    max_inflight_per_uav: 1
  detector:
    model_family: yolo
    proposal_mode: closed_set
    confidence_threshold: 0.25
    class_aliases_path: configs/yolo/class_aliases.yaml
  tracker:
    type: botsort
    min_track_observations: 3
    min_track_duration_s: 0.5
  geometry:
    mode: isaac_depth
    depth_anchor: bbox_bottom_center
    depth_patch_radius_px: 4
    min_depth_m: 0.2
    max_depth_m: 200.0
    max_measurement_age_s: 0.5
  state_estimator:
    type: constant_velocity_kalman
    max_prediction_age_s: 2.0
    max_position_jump_m: 10.0
    process_noise: 1.0
    measurement_noise: 0.5
  confirmation:
    mode: class_track_attribute_or_qwen
    require_qwen_for_attributes: true
    require_qwen_for_reacquire_new_track_id: true
  attributes:
    enabled: true
    mode: deterministic_then_qwen
    require_qwen_for_unsupported_attributes: true
    require_qwen_for_ambiguous_attributes: true
    color:
      enabled: true
      method: hsv_depth_mask
      supported_values:
        - red
        - blue
      roi_inset_ratio: 0.12
      min_valid_pixel_ratio: 0.15
      min_saturation: 0.25
      min_value: 0.15
      min_dominant_fraction: 0.55
      min_score_margin: 0.15
      depth_absolute_tolerance_m: 0.25
      depth_relative_tolerance: 0.05
      min_observations: 3
      min_duration_s: 0.4
      max_history_per_candidate: 16
      hue_ranges_deg:
        red:
          - [0.0, 20.0]
          - [340.0, 360.0]
        blue:
          - [190.0, 260.0]

targets:
  - id: target_i
    semantic_alias: 目标i
    appearance:
      shape: CUBE
      color_name: red
      color_rgb: [0.9, 0.1, 0.1]
      size_xyz_m: [0.8, 0.8, 0.8]
    initial_region:
      min_xyz_m: [18.0, 28.0, 0.5]
      max_xyz_m: [22.0, 32.0, 0.5]
    max_speed_mps: 1.5
    motion:
      mode: RANDOM_WALK
      region:
        min_xyz_m: [10.0, 20.0, 0.5]
        max_xyz_m: [35.0, 40.0, 0.5]
      speed_mps: 1.0
      initial_heading_deg: 0.0
      direction_change_interval_s: 4.0
      seed: 7
  - id: target_j
    semantic_alias: 目标j
    appearance:
      shape: CUBE
      color_name: blue
      color_rgb: [0.1, 0.2, 0.9]
      size_xyz_m: [0.8, 0.8, 0.8]
    initial_region:
      min_xyz_m: [-27.0, 8.0, 0.5]
      max_xyz_m: [-23.0, 12.0, 0.5]
    max_speed_mps: 1.5
    motion:
      mode: RANDOM_WALK
      region:
        min_xyz_m: [-40.0, 0.0, 0.5]
        max_xyz_m: [-10.0, 25.0, 0.5]
      speed_mps: 1.0
      initial_heading_deg: 0.0
      direction_change_interval_s: 4.0
      seed: 17

fleet:
  minimum_uav_separation_m: 5.0
  target_claim_policy: EXCLUSIVE
  route_conflict_policy: LOWER_PRIORITY_HOLDS
  assignment_failure_policy: REPORT_AND_REPLAN

search:
  transit_yaw_mode: FACE_POINT
  radius_m: 25.0
  timeout_s: 120.0

planner:
  max_plan_steps: 10
  max_goto_calls: 5
  max_search_calls: 1
  max_track_calls: 2
  max_reacquire_attempts_per_track: 2
  max_total_reacquire_attempts: 4
  min_track_duration_s: 1.0
  max_track_duration_s: 600.0
  default_on_target_lost: REACQUIRE
  default_reacquire_max_attempts: 2
  default_reacquire_search_radius_m: 10.0
  default_reacquire_timeout_s: 30.0

model_worker:
  max_inflight_per_uav: 1
  request_timeout_s: 60.0

model_broker:
  max_inflight_global: 4
  max_inflight_per_uav: 1
  max_pending_per_uav: 2
  starvation_timeout_s: 15.0

qwen_visual_review:
  enabled: false
  mode: shadow
  goto_interval_s: 5.0
  search_interval_s: 2.0
  inspect_interval_s: 1.0
  track_interval_s: 5.0
  max_recent_frames: 3
  max_image_side_px: 1024
  jpeg_quality: 80
  hover_position_tolerance_m: 0.25
  hover_max_correction_speed_mps: 0.5
  blocking_hover_timeout_s: 75.0
  blocking_timeout_fallback: CANCEL_AND_LAND

plan_revision:
  enabled: true
  max_revisions: 3
  cooldown_s: 5.0

frame_store:
  max_frames: 24
  max_bytes: 67108864
  max_age_s: 20.0

debug_images:
  enabled: false
  max_images_per_run: 20

experiment:
  name: fleet_cube_yolo
  seed: 42
  output_root: null

logging:
  terminal: true
  console_log_interval_updates: 10
  print_every_episode: false
  debug_logging: false
  csv: true

tensorboard:
  enabled: true
  scalars_only: true
  log_interval_updates: 1
  flush_interval_s: 30.0

checkpoint:
  save_best: true
  save_latest: true
  latest_interval_steps: 50000
  save_periodic: false
  save_full_base_model: false
  save_adapter_only: true
  save_optimizer_in_latest_only: true

evaluation:
  enabled: true
  interval_steps: 20000
  num_validation_episodes: 50
  num_test_episodes: 200
  deterministic: true
  fixed_validation_seeds: true
  fixed_test_seeds: true

artifacts:
  save_images: false
  save_videos: false
  save_trajectories: false
  save_observations: false
  save_raw_frames: false

figures:
  enabled: true
  format: png
  save_pdf: false

storage:
  min_free_space_gb_before_start: 20.0
  min_free_space_gb_during_run: 10.0
  warning_run_size_gb: 3.0
  max_run_size_gb: 5.0

