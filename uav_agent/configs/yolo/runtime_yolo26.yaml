schema_version: 1

simulation:
  headless: true
  physics_dt_s: 0.016666666666666666
  rendering_dt_s: 0.016666666666666666
  stage_units_in_meters: 1.0
  demo_steps: 120

scene:
  size_xyz_m: [100.0, 100.0, 30.0]
  obstacles:
    - obstacle_id: box_red
      center_xyz_m: [12.0, 4.0, 1.0]
      size_xyz_m: [3.0, 3.0, 2.0]
      color_rgb: [0.75, 0.25, 0.20]
      collidable: true
      motion_state: STATIC
    - obstacle_id: box_blue
      center_xyz_m: [-15.0, 5.0, 1.5]
      size_xyz_m: [3.0, 2.1, 3.0]
      color_rgb: [0.20, 0.35, 0.80]
      collidable: true
      motion_state: STATIC

uav:
  id: uav_1
  initial_position_xyz_m: [0.0, 0.0, 10.0]
  max_speed_mps: 5.0
  max_yaw_rate_deg_s: 60.0

camera:
  resolution_wh_px: [640, 480]
  frequency_hz: 10
  horizontal_fov_deg: 90.0
  focal_length_m: null
  pitch_deg: -45.0

obstacle_perception:
  mode: disabled
  max_distance_m: 40.0
  min_bbox_area_px: 64
  max_occlusion_ratio: 0.95

# This is a complete AppConfig, not an overlay.  It remains free of model paths;
# weights are supplied only to the isolated service process at startup.
target_perception:
  backend: ultralytics_service
  yolo_service:
    url: http://127.0.0.1:8011
    # Real GPU workers need a bounded warm-up allowance on their first Track
    # call.  A sub-second HTTP deadline can expire while model.track() keeps
    # running remotely and creates a false STREAM_BUSY race on the next frame.
    request_timeout_s: 5.0
    max_result_age_s: 2.0
    jpeg_quality: 90
    max_inflight_per_uav: 1
  detector:
    model_family: yolo
    proposal_mode: closed_set
    confidence_threshold: 0.25
    class_aliases_path: configs/yolo/class_aliases.yaml
    expected_model_family: yolo
    expected_model_names:
      0: cube
    expected_model_sha256: 895de7caa8af200c12f343c72e3a726ffae65e4d96d2092decaf96ef4558de07
  tracker:
    type: botsort
    min_track_observations: 3
    min_track_duration_s: 0.5
  geometry:
    mode: temporal_ray_depth
    depth_anchor: foreground_cluster_median
    depth_patch_radius_px: 4
    min_depth_m: 0.2
    max_depth_m: 200.0
    max_measurement_age_s: 0.5
    temporal_ray_depth:
      checkpoint_path: /home/amax/ry/vlm_drones/outputs/trained_models/target_state/temporal_ray_depth_yolo_deployment_v2/best.pt
      expected_sha256: 2a8acd63347a568a4e5588cfc335979709958f7859617405841062af679e023c
      manifest_path: /home/amax/ry/vlm_drones/outputs/trained_models/target_state/temporal_ray_depth_yolo_deployment_v2/model_manifest.json
      history_size: 6
      max_history_age_s: 2.0
      roi_size_px: 128
      use_rgb: true
      use_depth: true
      deterministic_fallback: true
      device: cpu
  state_estimator:
    type: constant_velocity_kalman
    max_prediction_age_s: 2.0
    max_position_jump_m: 10.0
    process_noise: 1.0
    measurement_noise: 0.5
  confirmation:
    mode: class_track_attribute_or_qwen
    require_qwen_for_attributes: true
    require_qwen_for_reacquire_new_track_id: true
  attributes:
    enabled: true
    mode: deterministic_then_qwen
    require_qwen_for_unsupported_attributes: true
    require_qwen_for_ambiguous_attributes: true
    color:
      enabled: true
      method: hsv_depth_mask
      supported_values:
        - red
        - blue
      roi_inset_ratio: 0.12
      min_valid_pixel_ratio: 0.15
      min_saturation: 0.25
      min_value: 0.15
      min_dominant_fraction: 0.55
      min_score_margin: 0.15
      depth_absolute_tolerance_m: 0.25
      depth_relative_tolerance: 0.05
      min_observations: 3
      min_duration_s: 0.4
      max_history_per_candidate: 16
      hue_ranges_deg:
        red:
          - [0.0, 20.0]
          - [340.0, 360.0]
        blue:
          - [190.0, 260.0]

target:
  initial_region:
    min_xyz_m: [9.0, -1.0, 0.5]
    max_xyz_m: [11.0, 1.0, 0.5]
  max_speed_mps: 1.5
  motion:
    mode: RANDOM_WALK
    region:
      min_xyz_m: [-40.0, -40.0, 0.5]
      max_xyz_m: [40.0, 40.0, 0.5]
    speed_mps: 1.0
    initial_heading_deg: 0.0
    direction_change_interval_s: 4.0
    seed: 7

search:
  transit_yaw_mode: FACE_POINT
  radius_m: 25.0
  timeout_s: 120.0

planner:
  max_plan_steps: 10
  max_goto_calls: 5
  max_search_calls: 1
  max_track_calls: 2
  max_reacquire_attempts_per_track: 2
  max_total_reacquire_attempts: 4
  min_track_duration_s: 1.0
  max_track_duration_s: 600.0
  default_on_target_lost: REACQUIRE
  default_reacquire_max_attempts: 2
  default_reacquire_search_radius_m: 10.0
  default_reacquire_timeout_s: 30.0

model_worker:
  max_inflight_per_uav: 1
  request_timeout_s: 60.0

qwen_visual_review:
  enabled: false
  mode: shadow
  goto_interval_s: 5.0
  search_interval_s: 2.0
  inspect_interval_s: 1.0
  track_interval_s: 5.0
  max_recent_frames: 3
  max_image_side_px: 1024
  jpeg_quality: 80
  hover_position_tolerance_m: 0.25
  hover_max_correction_speed_mps: 0.5
  blocking_hover_timeout_s: 75.0
  blocking_timeout_fallback: CANCEL_AND_LAND

plan_revision:
  enabled: true
  max_revisions: 3
  cooldown_s: 5.0

frame_store:
  max_frames: 24
  max_bytes: 67108864
  max_age_s: 20.0

debug_images:
  # Representative, annotated candidate-state images only. Raw frames and
  # video remain disabled below, and this writer is hard-capped per run.
  enabled: true
  max_images_per_run: 20

experiment:
  name: yolo26_production
  seed: 42
  output_root: null

logging:
  terminal: true
  console_log_interval_updates: 10
  print_every_episode: false
  debug_logging: false
  csv: true

tensorboard:
  enabled: true
  scalars_only: true
  log_interval_updates: 1
  flush_interval_s: 30.0

checkpoint:
  save_best: true
  save_latest: true
  latest_interval_steps: 50000
  save_periodic: false
  save_full_base_model: false
  save_adapter_only: true
  save_optimizer_in_latest_only: true

evaluation:
  enabled: true
  interval_steps: 20000
  num_validation_episodes: 50
  num_test_episodes: 200
  deterministic: true
  fixed_validation_seeds: true
  fixed_test_seeds: true

artifacts:
  save_images: false
  save_videos: false
  save_trajectories: false
  save_observations: false
  save_raw_frames: false

figures:
  enabled: true
  format: png
  save_pdf: false

storage:
  min_free_space_gb_before_start: 20.0
  min_free_space_gb_during_run: 10.0
  warning_run_size_gb: 3.0
  max_run_size_gb: 5.0
